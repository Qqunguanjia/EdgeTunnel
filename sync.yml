name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0:00（北京时间 8:00）执行[reference:7][reference:8]
  workflow_dispatch:      # 允许你手动触发

jobs:
  sync_with_upstream:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }} # 确保只对 Fork 仓库运行[reference:9]
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v3

      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: Qqunguanjia/EdgeTunnel   # 必填！[reference:10]
          upstream_sync_branch: main                 # 原仓库分支名[reference:11]
          target_sync_branch: main                   # 你的 Fork 分支名[reference:12]
